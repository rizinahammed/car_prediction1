<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Price Predictor</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background-color: #f5f5f5;
}
.container {
    max-width: 600px;
    margin: 0 auto;
    background-color: white;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 5px;
}
h1 {
    text-align: center;
    color: #333;
}
form {
    display: flex;
    flex-direction: column;
}
.group {
    margin-bottom: 15px;
}
label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
}
input, select {
    width: 100%;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 3px;
    box-sizing: border-box;
}
button {
    padding: 10px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 16px;
}
button:hover {
    background-color: #45a049;
}
.result {
    margin-top: 20px;
    padding: 10px;
    background-color: #e7f3e7;
    border: 1px solid #4CAF50;
    border-radius: 3px;
    text-align: center;
    font-weight: bold;
}
.hint {
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
    color: #666;
}
</style>
</head>
<body>
<div class="container">
    <h1>Car Price Predictor</h1>
    <form action="/predict" method="post">
        <div class="group">
            <label for="year">Year</label>
            <input type="number" id="year" name="year" placeholder="2015" required>
        </div>
        <div class="group">
            <label for="showroom_price">Showroom Price (lakhs)</label>
            <input type="number" step="0.01" id="showroom_price" name="showroom_price" placeholder="8.50" required>
        </div>
        <div class="group">
            <label for="kms_driven">Kilometers Driven</label>
            <input type="number" id="kms_driven" name="kms_driven" placeholder="45000" required>
        </div>
        <div class="group">
            <label for="owners">Previous Owners</label>
            <input type="number" id="owners" name="owners" placeholder="1" required>
        </div>
        <div class="group">
            <label for="fuel">Fuel Type</label>
            <select id="fuel" name="fuel">
                <option value="Petrol">Petrol</option>
                <option value="Diesel">Diesel</option>
                <option value="CNG">CNG</option>
            </select>
        </div>
        <div class="group">
            <label for="seller_type">Seller Type</label>
            <select id="seller_type" name="seller_type">
                <option value="Dealer">Dealer</option>
                <option value="Individual">Individual</option>
            </select>
        </div>
        <div class="group">
            <label for="transmission">Transmission</label>
            <select id="transmission" name="transmission">
                <option value="Manual">Manual</option>
                <option value="Automatic">Automatic</option>
            </select>
        </div>
        <button type="submit">Predict Price</button>
    </form>
    <div class="hint">Fill all fields correctly for best prediction</div>
    {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
    {% endif %}
</div>
</body>
</html>
